[package]
name        = "bitcoin-wallet-tauri"
version     = "0.1.0"
description = "Bitcoin wallet desktop app — Rust backend + React UI"
edition     = "2021"

[lib]
name = "bitcoin_wallet_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri               = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde               = { version = "1", features = ["derive"] }
serde_json          = "1"
bitcoin             = "0.32"
bip39               = "2.1"
rand                = "0.8"
anyhow              = "1.0"
